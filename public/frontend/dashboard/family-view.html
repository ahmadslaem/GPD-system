<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>عرض العائلة</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="css/all.min.css">
  <link rel="stylesheet" href="css/css2.css">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>

<body>
  <div class="d-flex" id="app-wrapper">
    <div id="main-content" class="d-flex flex-column">
      <main id="content-area" class="flex-grow-1 p-3 p-md-4">
        <div class="page-header d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
          <div>
            <h1 class="page-title"><i class="fa-solid fa-house-user me-2 text-primary"></i>عرض العائلة</h1>
            <p class="page-sub mb-0">عرض بيانات الأسرة والأفراد مع إمكانية التعديل أو الحذف</p>
          </div>
          <div class="d-flex gap-2 flex-wrap">
            <a href="families.html" class="btn btn-sm btn-outline-secondary">
              <i class="fa-solid fa-arrow-right me-1"></i>العودة إلى الأسر
            </a>
          </div>
        </div>

        <div class="content-card">
          <div class="content-card__header">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
              <div>
                <div class="fw-bold" id="familyTitle">العائلة</div>
                <div class="small text-muted" id="familyMeta">سيتم تحميل بيانات الأسرة المختارة</div>
              </div>
              <div class="badge bg-primary" id="familyBadge">—</div>
            </div>
          </div>

          <div class="content-card__body">
            <div class="form-card mb-3">
              <div class="form-card-title"><i class="fa-solid fa-user text-primary"></i>بيانات الأسرة</div>
              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label class="field-label">رقم الأسرة</label>
                  <input type="text" id="familyId" class="form-control" readonly style="background:#f8fafc;" />
                </div>
                <div class="col-12 col-md-6">
                  <label class="field-label">اسم رب الأسرة</label>
                  <input type="text" id="familyName" class="form-control" readonly style="background:#f8fafc;" />
                </div>
                <div class="col-12 col-md-6">
                  <label class="field-label">المخيم</label>
                  <input type="text" id="familyCamp" class="form-control" readonly style="background:#f8fafc;" />
                </div>
                <div class="col-12 col-md-6">
                  <label class="field-label">المحافظة</label>
                  <input type="text" id="familyGov" class="form-control" readonly style="background:#f8fafc;" />
                </div>
              </div>
            </div>

            <div class="form-card">
              <div class="form-card-title"><i class="fa-solid fa-users text-primary"></i>الأفراد</div>
              <div id="membersList"></div>
            </div>

            <div class="form-card mt-3">
              <div class="form-card-title"><i class="fa-solid fa-clock-rotate-left text-primary"></i>سجل التغييرات
                <button class="btn btn-sm btn-outline-primary ms-2" id="btnAuditRefresh" type="button"><i class="fa-solid fa-rotate"></i> تحديث</button>
              </div>
              <div id="auditList" class="small"><div class="text-center text-muted py-3">جارٍ التحميل...</div></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
    <script>
    $(document).ready(function () {
      if (!NDS.auth.guardPage('families')) return;
      var params = new URLSearchParams(window.location.search);
      var familyId = params.get('familyId');
      var familyName = params.get('familyName') || '—';
      var members = [];

      function renderMembers() {
        if (!members.length) {
          $('#membersList').html('<div class="text-center text-muted py-3">لا يوجد أفراد مسجلون</div>');
          return;
        }
        $('#membersList').html(members.map(function (m) {
          var disability = m.has_disability ? 'نعم' : 'لا';
          return '<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 p-3 mb-2 border rounded-3" style="background:#f8fafc;"><div><div class="fw-semibold">' + m.name + '</div><div class="small text-muted">' + (m.national_id || '-') + ' · ' + (m.gender === 'female' ? 'أنثى' : 'ذكر') + ' · إعاقة: ' + disability + '</div></div><div class="d-flex gap-2"><a href="edit-member.html?memberId=' + m.id + '&familyId=' + familyId + '&familyName=' + encodeURIComponent(familyName) + '&memberName=' + encodeURIComponent(m.name || '') + '&memberNid=' + encodeURIComponent(m.national_id || '') + '&memberDob=' + (m.birth_date || '') + '&memberDisability=' + encodeURIComponent(disability) + '" class="btn btn-sm btn-outline-primary" title="تعديل"><i class="fa-solid fa-pen"></i></a><button class="btn btn-sm btn-outline-danger btn-delete-member" data-id="' + m.id + '" title="حذف"><i class="fa-solid fa-trash"></i></button></div></div>';
        }).join(''));
      }

      async function loadFamily() {
        if (!familyId) return;
        $('#membersList').html('<div class="text-center text-muted py-3">جارٍ التحميل...</div>');
        try {
          var response = await NDS.api.family(familyId);
          var f = response.data || {};
          familyName = f.name || f.head_name || familyName;
          $('#familyId').val(f.family_number || familyId);
          $('#familyName').val(familyName);
          $('#familyCamp').val(f.camp || '—');
          $('#familyGov').val(f.gov || '—');
          $('#familyTitle').text('ملف الأسرة: ' + familyName);
          $('#familyMeta').text('عرض البيانات والأفراد المسجلين');
          $('#familyBadge').text(f.family_number || familyId);
          members = f.members || [];
          renderMembers();
        } catch (error) {
          $('#membersList').html('<div class="text-center text-danger py-3">' + (error.message || 'تعذر تحميل الأسرة') + '</div>');
        }
      }

      $(document).on('click', '.btn-delete-member', async function () {
        if (!confirm('هل تريد حذف هذا الفرد؟')) return;
        try {
          await NDS.api.deleteMember($(this).data('id'));
          await loadFamily();
        } catch (error) {
          alert(error.message || 'تعذر حذف الفرد');
        }
      });

      /* ── سجل التغييرات ── */
      var AUDIT_LABELS = {
        created: 'إنشاء', updated: 'تعديل', deleted: 'حذف',
        national_id: 'رقم الهوية', head_name: 'اسم رب الأسرة', phone: 'الهاتف',
        birth_date: 'تاريخ الميلاد', camp_id: 'المخيم', shelter_number: 'رقم المأوى',
        members_count: 'إجمالي الأفراد', adults_count: 'البالغون', children_count: 'الأطفال',
        pwd_count: 'ذوو الإعاقة', has_pwd: 'لديه إعاقة', is_female_headed: 'رئاسة أنثى',
        fhh_reason: 'سبب الرئاسة', vulnerability_score: 'درجة الضعف', vulnerability_level: 'مستوى الضعف',
        notes: 'ملاحظات', name: 'الاسم', gender: 'الجنس', has_disability: 'إعاقة فرد'
      };

      function auditField(field) { return AUDIT_LABELS[field] || field; }

      function auditValue(field, value) {
        if (value === null || value === undefined || value === '') return '—';
        if (field === 'vulnerability_level') return { high: 'عالٍ', medium: 'متوسط', low: 'منخفض' }[value] || value;
        if (field === 'fhh_reason') return { widow: 'أرملة', divorced: 'مطلقة', husband_absent: 'غياب رب الأسرة', other: 'أخرى' }[value] || value;
        if (field === 'gender') return value === 'female' ? 'أنثى' : 'ذكر';
        if (value === true || value === 1 || value === '1') return 'نعم';
        if (value === false || value === 0 || value === '0') return 'لا';
        return String(value);
      }

      function renderAuditLogs(logs) {
        if (!logs || !logs.length) {
          $('#auditList').html('<div class="text-center text-muted py-3">لا توجد تغييرات مسجلة</div>');
          return;
        }
        var html = logs.map(function (log) {
          var badge = log.action === 'created' ? 'success'
            : log.action === 'deleted' ? 'danger' : 'warning';
          var target = log.target === 'member' ? 'فرد #' + log.target_id : 'الأسرة';
          var details = '';

          if (log.action === 'updated' && log.changes) {
            var oldV = log.changes.old || {}, newV = log.changes.new || {};
            details = Object.keys(newV).map(function (field) {
              return '<div class="small text-muted">' + auditField(field) + ': '
                + '<span class="text-decoration-line-through">' + auditValue(field, oldV[field]) + '</span> ← '
                + '<span class="fw-semibold text-dark">' + auditValue(field, newV[field]) + '</span></div>';
            }).join('');
          }

          return '<div class="p-2 mb-2 border rounded-3" style="background:#f8fafc;">'
            + '<div class="d-flex justify-content-between flex-wrap gap-1">'
            + '<div><span class="badge bg-' + badge + '">' + (AUDIT_LABELS[log.action] || log.action) + '</span> '
            + '<span class="fw-semibold">' + target + '</span> '
            + '<span class="text-muted small">بواسطة ' + (log.user || 'نظام') + '</span></div>'
            + '<span class="text-muted small">' + (log.at || '') + '</span></div>'
            + details + '</div>';
        }).join('');
        $('#auditList').html(html);
      }

      async function loadAuditLogs() {
        if (!familyId) return;
        try {
          var res = await NDS.api.familyAuditLogs(familyId);
          renderAuditLogs(res.data || []);
        } catch (error) {
          $('#auditList').html('<div class="text-center text-muted py-2">' + (error.message || 'تعذر تحميل السجل') + '</div>');
        }
      }

      $('#btnAuditRefresh').on('click', loadAuditLogs);

      loadFamily();
      loadAuditLogs();
    });
  </script>
</body>

</html>
